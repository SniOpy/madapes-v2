<header class="site-header" aria-label="Main header">
  <div class="container site-header__inner">
    <a class="brand" href="/en" aria-label="Madapes Agency home">
      <img
        class="brand__icon"
        src="{{BASE}}assets/images/logo/logo.webp"
        alt="Madapes Agency"
        width="48"
        height="48"
      />
    </a>

    <nav class="site-nav" id="mobile-nav" aria-label="Main navigation">
      <ul class="site-nav__list" role="list">
        <li><a href="/en">Home</a></li>
        <li class="site-nav__dropdown-item">
          <button
            class="site-nav__dropdown-toggle"
            type="button"
            aria-expanded="false"
            aria-haspopup="true"
            aria-controls="services-dropdown-menu"
            data-services-toggle
          >
            Services
            <i data-lucide="chevron-down" aria-hidden="true"></i>
          </button>
          <ul class="site-nav__dropdown" id="services-dropdown-menu" role="list" data-services-dropdown>
            <li><a href="/en/google-ads">Google Ads</a></li>
            <li><a href="/en/landing-pages">Landing Pages</a></li>
            <li><a href="/en/seo">SEO</a></li>
            <li><a href="/en/tracking">Performance tracking</a></li>
            <li class="site-nav__dropdown-separator" aria-hidden="true"></li>
            <li><a href="/en/offers">Our offers</a></li>
          </ul>
        </li>
        <li><a href="/en/work">Work</a></li>
        <li><a href="/en/blog">Blog</a></li>
        <li><a href="/en/contact">Contact</a></li>
      </ul>
    </nav>

    <div class="site-header__actions">
      <nav class="lang-switch" aria-label="Choose language">
        <a class="lang-switch__link" href="/" data-lang-switch="fr" hreflang="fr" lang="fr" aria-label="Français">
          <svg class="lang-switch__flag" viewBox="0 0 24 16" aria-hidden="true">
            <rect width="8" height="16" fill="#0055A4" />
            <rect x="8" width="8" height="16" fill="#FFFFFF" />
            <rect x="16" width="8" height="16" fill="#EF4135" />
          </svg>
        </a>
        <a class="lang-switch__link" href="/en" data-lang-switch="en" hreflang="en" lang="en" aria-label="English">
          <svg class="lang-switch__flag" viewBox="0 0 19 10" aria-hidden="true">
            <rect width="19" height="10" fill="#BF0A30" />
            <g fill="#FFFFFF">
              <rect y="0.77" width="19" height="0.77" />
              <rect y="2.31" width="19" height="0.77" />
              <rect y="3.85" width="19" height="0.77" />
              <rect y="5.38" width="19" height="0.77" />
              <rect y="6.92" width="19" height="0.77" />
              <rect y="8.46" width="19" height="0.77" />
            </g>
            <rect width="7.6" height="5.38" fill="#002868" />
          </svg>
        </a>
      </nav>
      <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-pressed="false"
        aria-label="Switch to light mode"
      >
        <span class="theme-toggle__track" aria-hidden="true">
          <span class="theme-toggle__thumb"></span>
        </span>
        <i data-lucide="sun" class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true"></i>
        <i data-lucide="moon" class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true"></i>
      </button>

      <a class="btn btn-primary site-header__cta" href="/en/quote">Request a quote</a>
    </div>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Open menu"
      aria-controls="mobile-nav"
      aria-expanded="false"
    >
      <span class="menu-toggle__line"></span>
      <span class="menu-toggle__line"></span>
      <span class="menu-toggle__line"></span>
    </button>
  </div>
</header>
