<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta
      name="description"
      content="Blog Madapes Agency : conseils concrets en Google Ads, landing pages, SEO et optimisation des performances."
    />
    <title>Blog | Madapes Agency</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/variables.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/sections.css" />
  </head>
  <body data-path-prefix="../">
    <div data-site-header></div>
    <main class="site-main">
      <section class="section hero" aria-labelledby="blog-title">
        <div class="container hero__grid">
          <div class="hero__content">
            <p class="eyebrow">Blog</p>
            <h1 class="hero__title" id="blog-title">Des contenus utiles pour mieux <strong>piloter votre acquisition.</strong></h1>
            <p class="hero__lead">
              Les premiers articles arrivent bientôt pour vous aider à prendre de meilleures décisions.
            </p>
            <div class="hero-buttons">
              <a class="btn btn-primary" href="/devis">Demander un devis</a>
              <a class="btn btn-secondary" href="/contact">Parler de votre projet</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="../assets/js/modules/security.js"></script>
    <script defer src="../assets/js/main.js"></script>
  </body>
</html>
